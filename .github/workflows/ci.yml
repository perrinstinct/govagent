name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPECTRAL_VERSION: 6.16.3 # keep in sync with the Dockerfile

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  integration:
    name: Integration tests (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g "@stoplight/spectral-cli@${SPECTRAL_VERSION}"
      - run: uv sync --locked
      - run: uv run pytest -m integration

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: govagent:ci
          build-args: SPECTRAL_VERSION=${{ env.SPECTRAL_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm govagent:ci spectral --version
      - run: docker run --rm govagent:ci govagent version
