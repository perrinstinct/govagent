openapi: 3.1.0
info:
  title: HR Directory
  version: 1.3.0
  description: Employees, teams and leave requests of the company directory.
  contact:
    email: hr-tech@example.com
servers:
  - url: https://hr.example.com/api/v1
security:
  - oidc: [directory.read]
tags:
  - name: employees
  - name: leave
paths:
  /employees:
    get:
      tags: [employees]
      summary: List employees
      description: Returns employees, optionally filtered by team.
      operationId: listEmployees
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The employees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
        "403":
          $ref: "#/components/responses/Forbidden"
  /employees/{employeeId}:
    get:
      tags: [employees]
      summary: Get an employee
      description: Returns the public profile of one employee.
      operationId: getEmployee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: The employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [employees]
      summary: Update an employee
      description: Updates the editable fields of an employee profile.
      operationId: updateEmployee
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: The updated employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /leave-requests:
    post:
      tags: [leave]
      summary: Request leave
      description: Submits a leave request for approval by the employee's manager.
      operationId: createLeaveRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequest"
      responses:
        "201":
          description: The submitted request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "422":
          description: The dates overlap an existing request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://login.example.com/.well-known/openid-configuration
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
  responses:
    Forbidden:
      description: The caller may not access this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The employee does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Employee:
      type: object
      required: [employeeId, fullName]
      properties:
        employeeId:
          type: string
        fullName:
          type: string
        jobTitle:
          type: string
        manager:
          type: object
          properties:
            employeeId:
              type: string
            fullName:
              type: string
    EmployeeUpdate:
      type: object
      properties:
        jobTitle:
          type: string
        phoneNumber:
          type: string
    LeaveRequest:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        leaveType:
          type: string
          enum: [vacation, sick, parental]
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
