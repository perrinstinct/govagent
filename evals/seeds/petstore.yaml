# Pet store API: eval seed (lint-clean).
openapi: 3.0.3
info:
  title: Pet Store
  version: 2.1.0
  description: Manage the pets and their owners in a pet store.
  contact:
    email: pets-api@example.com # team mailbox
servers:
  - url: https://api.petstore.example.com/v2
    description: Production
  - url: https://sandbox.petstore.example.com/v2
    description: Sandbox
security:
  - apiKey: []
tags:
  - name: pets
  - name: owners
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      description: Returns a page of pets, newest first.
      operationId: listPets
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [pets]
      summary: Create a pet
      description: Registers a new pet and returns it with its generated id.
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [pets]
      summary: Get a pet
      description: Returns one pet by id.
      operationId: getPet
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [pets]
      summary: Delete a pet
      description: Removes a pet from the store.
      operationId: deletePet
      responses:
        "204":
          description: The pet was deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /pet-owners/{ownerId}/pets:
    get:
      tags: [owners]
      summary: List the pets of an owner
      description: Returns every pet registered by one owner.
      operationId: listOwnerPets
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The owner's pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Pet:
      type: object
      required: [petId, displayName]
      properties:
        petId:
          type: string
          format: uuid
        displayName:
          type: string # not unique
        birthDate:
          type: string
          format: date
        ownerId:
          type: string
          format: uuid
    NewPet:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        birthDate:
          type: string
          format: date
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
