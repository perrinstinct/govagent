[project]
name = "govagent"
version = "0.1.0"
description = "Agent that enforces API design governance on OpenAPI specs: deterministic lint, verified JSON Patch fixes, reviewable PRs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-aws>=1.8.0",
    "langgraph>=1.2.13",
    "openapi-spec-validator>=0.9.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.2",
]

[project.scripts]
govagent = "govagent.interfaces.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.format]
# Leave code blocks in Markdown (docs/SPEC.md) as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT",
    "S",   # bandit
    "T20", # no print: use structlog
]

[tool.ruff.lint.isort]
known-first-party = ["govagent", "evals", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607"]
"evals/**" = ["S311"]  # seeded `random` on purpose: reproducible datasets, not cryptography

[tool.pyright]
include = ["src", "tests", "evals"]
strict = ["src", "evals"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]  # default selection: see tests/conftest.py
markers = [
    "integration: needs the Spectral CLI on PATH",
    "bedrock: makes real Amazon Bedrock calls (run only when asked)",
]
