openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
  contact:
    email: api-team@example.com
servers:
  - url: https://api.example.com/v1
security:
  - apiKey: []
tags:
  - name: pets
paths:
  /petOwners:
    get:
      tags: [pets]
      summary: List pets
      description: Returns every pet in the store.
      operationId: listPets
      responses:
        "200":
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Pet:
      type: object
      required: [petName]
      properties:
        petName:
          type: string
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
